summary: pg_cron snap component add/remove on a running PostgreSQL

execute: |
  echo "Locating the pg-cron component built next to the snap..."
  COMP="$(ls "${PROJECT_PATH}"/postgresql+pg-cron_*.comp 2>/dev/null | head -1)"
  if [ -z "$COMP" ]; then
    echo "ERROR: postgresql+pg-cron_*.comp not found in ${PROJECT_PATH} (snapcraft pack builds it next to the .snap)" >&2
    exit 1
  fi
  REV="$(snap list postgresql | awk 'NR == 2 {print $3}')"
  CONF=/var/snap/postgresql/common/etc/postgresql/18/main/conf.d/00-snap-components.conf
  PSQL="postgresql.psql -U postgres -h /tmp -Atq"

  echo "Without the component: no extension, defaults in the generated conf..."
  snap components postgresql | grep -E "postgresql\+pg-cron\s+available"
  test -f "$CONF"
  ! grep -q pg_cron "$CONF"
  $PSQL -c "SHOW shared_preload_libraries;" | grep -v pg_cron
  test -z "$($PSQL -c "SELECT name FROM pg_available_extensions WHERE name = 'pg_cron';")"

  echo "Installing the component..."
  snap install "$COMP" --dangerous
  snap components postgresql | grep -E "postgresql\+pg-cron\s+installed\s+standard"
  test -f "/snap/postgresql/components/$REV/pg-cron/lib/pg_cron.so"

  echo "The running server is untouched until restart..."
  $PSQL -c "SHOW shared_preload_libraries;" | grep -v pg_cron

  echo "Restarting PostgreSQL to load the component..."
  snap restart postgresql.postgresql
  timeout 60 /bin/bash -c "while ! postgresql.isready ; do echo Waiting for postgresql...; sleep 1; done"
  cat "$CONF"
  grep -F "dynamic_library_path = '\$libdir:/snap/postgresql/components/$REV/pg-cron/lib'" "$CONF"
  grep -F "extension_control_path = '\$system:/snap/postgresql/components/$REV/pg-cron/share'" "$CONF"
  grep -E "^shared_preload_libraries = 'pg_cron'" "$CONF"
  grep -E "^cron.host = '/tmp'" "$CONF"
  $PSQL -c "SHOW shared_preload_libraries;" | grep -x pg_cron
  $PSQL -c "SELECT name FROM pg_available_extensions WHERE name = 'pg_cron';" | grep -x pg_cron

  echo "Creating the extension and scheduling a job..."
  $PSQL -c "CREATE EXTENSION pg_cron;"
  $PSQL -c "CREATE TABLE cron_test (ts timestamptz DEFAULT now());"
  $PSQL -c "SELECT cron.schedule('spread', '* * * * *', 'INSERT INTO cron_test DEFAULT VALUES');" | grep -x 1
  $PSQL -c "SELECT jobname, active FROM cron.job;" | grep -x "spread|t"

  echo "Waiting for the job to run (pg_cron fires at most once a minute)..."
  timeout 150 /bin/bash -c "while [ \"\$($PSQL -c 'SELECT count(*) FROM cron_test;')\" = 0 ]; do sleep 5; done"
  $PSQL -c "SELECT status FROM cron.job_run_details ORDER BY runid DESC LIMIT 1;" | grep -x succeeded

  echo "Dropping the extension and removing the component..."
  $PSQL -c "SELECT cron.unschedule('spread');" | grep -x t
  $PSQL -c "DROP EXTENSION pg_cron;"
  snap remove postgresql+pg-cron
  snap components postgresql | grep -E "postgresql\+pg-cron\s+available"
  test ! -e "/snap/postgresql/components/$REV/pg-cron"

  echo "After restart the server is back to defaults..."
  snap restart postgresql.postgresql
  timeout 60 /bin/bash -c "while ! postgresql.isready ; do echo Waiting for postgresql...; sleep 1; done"
  cat "$CONF"
  ! grep -q pg_cron "$CONF"
  $PSQL -c "SHOW shared_preload_libraries;" | grep -v pg_cron
  test -z "$($PSQL -c "SELECT name FROM pg_available_extensions WHERE name = 'pg_cron';")"
  $PSQL -c "SELECT count(*) FROM cron_test;" | grep -vx 0

  echo "Ensure no AppArmor denials from the daemon..."
  if journalctl -k | grep 'apparmor="DENIED"' | grep 'profile="snap.postgresql.postgresql"'; then
    echo "ERROR: AppArmor denials produced by the postgresql daemon (see above)" >&2
    exit 1
  fi

  echo "Component test completed."
