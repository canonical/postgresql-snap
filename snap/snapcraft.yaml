name: postgresql
base: core24
version: '16.15'
summary: PostgreSQL in a snap.
description: |
  PostgreSQL is a free and open-source relational database management
  system emphasizing extensibility and SQL compliance.
title: PostgreSQL
contact: https://matrix.to/#/#charmhub-data-platform:ubuntu.com
license: Apache-2.0
issues: https://github.com/canonical/postgresql-snap/issues
source-code: https://github.com/canonical/postgresql-snap
website: https://canonical.com/data/postgresql

platforms:
  amd64:
  arm64:
grade: stable
confinement: strict

system-usernames:
  _daemon_: shared

plugs:
  shared-memory:
    private: true

# This slot exposes all of this snap to any other snap to use postgresql without
# bundling any of postgresql. This allows multiple snaps to use the postgresql
# snap however they see fit, without duplicating postgresql files on the device
# (by bundling postgresql with every snap)
slots:
  postgresql:
    interface: content
    content: bins
    read:
      - $SNAP

hooks:
  install:
    plugs:
      - network

layout:
  /usr/bin/perl:
    symlink: $SNAP/usr/bin/perl
  /usr/bin/install:
    bind-file: $SNAP/usr/bin/install
  /usr/bin/pg_lsclusters:
    symlink: $SNAP/usr/bin/pg_lsclusters
  /usr/bin/pg_ctlcluster:
    symlink: $SNAP/usr/bin/pg_ctlcluster
  /usr/bin/pg_dropcluster:
    symlink: $SNAP/usr/bin/pg_dropcluster
  /usr/lib/python3/dist-packages:
    bind: $SNAP/usr/lib/python3/dist-packages
  /etc/perl:
    bind: $SNAP/etc/perl
  /usr/local/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/perl:
    bind: $SNAP/usr/local/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/perl
  /usr/local/share/perl:
    bind: $SNAP/usr/local/share/perl
  /usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/perl5:
    bind: $SNAP/usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/perl5
  /usr/share/perl5:
    bind: $SNAP/usr/share/perl5
  /usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/perl-base:
    bind: $SNAP/usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/perl-base
  /usr/share/perl:
    bind: $SNAP/usr/share/perl
  /usr/local/lib/site_perl:
    bind: $SNAP/usr/local/lib/site_perl
  /usr/lib/postgresql/16:
    bind: $SNAP/usr/lib/postgresql/16
  /var/cache/postgresql:
    bind: $SNAP_COMMON/var/cache/postgresql
  /etc/postgresql:
    bind: $SNAP_COMMON/etc/postgresql
  /etc/postgresql-common:
    bind: $SNAP_COMMON/etc/postgresql-common
  /var/lib/postgresql:
    bind: $SNAP_COMMON/var/lib/postgresql
  /var/log/postgresql:
    bind: $SNAP_COMMON/var/log/postgresql
  /usr/share/postgresql:
    bind: $SNAP/usr/share/postgresql

apps:
  # Client apps exec the real ELF binaries: the Perl pg_wrapper behind
  # usr/bin/* reads /etc/shadow via Perl's implicit getspnam() and probes
  # _daemon_-owned cluster paths when run as root, spamming the kernel log
  # with AppArmor denials (issue #190). The wrapper's cluster/socket
  # discovery is replaced by the PGHOST default below; -h/--host flags and
  # connection URIs still override it. PGGSSENCMODE=disable stops libpq's
  # GSSAPI probing on TCP connections (krb5 init reads /etc/gss/mech.d/,
  # denied under confinement); a gssencmode= conninfo parameter overrides.
  createdb:
    command: usr/lib/postgresql/16/bin/createdb
    environment:
      PGHOST: /tmp
      PGGSSENCMODE: disable
  createuser:
    command: usr/lib/postgresql/16/bin/createuser
    environment:
      PGHOST: /tmp
      PGGSSENCMODE: disable
  archivecleanup:
    command: archivecleanup.sh
  createcluster:
    command: create-cluster.sh
    plugs:
      - network
  dropcluster:
    command: drop-cluster.sh
  isready:
    command: usr/lib/postgresql/16/bin/pg_isready
    environment:
      PGHOST: /tmp
      PGGSSENCMODE: disable
    plugs:
      - network
  restore:
    command: usr/lib/postgresql/16/bin/pg_restore
    environment:
      PGHOST: /tmp
      PGGSSENCMODE: disable
    plugs:
      - network
  config:
    command: usr/bin/pg_config
  dump:
    command: usr/lib/postgresql/16/bin/pg_dump
    environment:
      PGHOST: /tmp
      PGGSSENCMODE: disable
    plugs:
      - network
  lsclusters:
    command: ls-clusters.sh
  recvlogical:
    command: usr/lib/postgresql/16/bin/pg_recvlogical
    environment:
      PGHOST: /tmp
      PGGSSENCMODE: disable
    plugs:
      - network
  basebackup:
    command: usr/lib/postgresql/16/bin/pg_basebackup
    environment:
      PGHOST: /tmp
      PGGSSENCMODE: disable
    plugs:
      - network
  conftool:
    command: conftool.sh
  ctl:
    command: ctl.sh
    plugs:
      - network
      - network-bind
  ctlcluster:
    command: ctl-cluster.sh
    plugs:
      - network
      - network-bind
  dumpall:
    command: usr/lib/postgresql/16/bin/pg_dumpall
    environment:
      PGHOST: /tmp
      PGGSSENCMODE: disable
    plugs:
      - network
  receivewal:
    command: usr/lib/postgresql/16/bin/pg_receivewal
    environment:
      PGHOST: /tmp
      PGGSSENCMODE: disable
    plugs:
      - network
  renamecluster:
    command: rename-cluster.sh
    plugs:
      - network
      - network-bind
  pgbench:
    command: usr/lib/postgresql/16/bin/pgbench
    environment:
      PGHOST: /tmp
      PGGSSENCMODE: disable
    plugs:
      - network
  psql:
    command: usr/lib/postgresql/16/bin/psql
    environment:
      PGHOST: /tmp
      PGGSSENCMODE: disable
    plugs:
      - network
  postgresql:
    command: >-
      ctl-cluster.sh --skip-systemctl-redirect --foreground 16 main start
    daemon: simple
    plugs:
      - network
      - network-bind

parts:
  postgres-debs:
    plugin: nil
    stage-packages:
      - postgresql=16+257build1.1
      - util-linux
      - locales-all
      - coreutils
    override-stage: |
      craftctl default
      # Use tmp for socket
      ls -1 $SNAPCRAFT_STAGE/usr/bin/pg_* | xargs sed -i \
        's/\/var\/run\/postgresql/\/tmp/g'
      sed -i 's/\/var\/run\/postgresql/\/tmp/g' \
        $SNAPCRAFT_STAGE/usr/share/perl5/PgCommon.pm
      # Pass user in startup checks
      sed -i "s/psql -h /psql -U postgres -h /g" \
        $SNAPCRAFT_STAGE/usr/bin/pg_ctlcluster
      # Don't have postgres children reset oom_score_adj: strict confinement
      # denies the write, spamming the kernel log with AppArmor denials on
      # every fork (issue #190). The adjustment is a no-op in the snap anyway,
      # as the root-only -900 postmaster protection never runs (we setpriv to
      # _daemon_ first). Overridable via the cluster 'environment' file.
      sed -i 's|"/proc/self/oom_score_adj"|"/dev/null"|' \
        $SNAPCRAFT_STAGE/usr/bin/pg_ctlcluster
      # Drop the best-effort 'chattr +C' (btrfs no-CoW) on the new data dir:
      # chattr is not shipped in the snap and executing the base's copy is
      # denied by AppArmor on some hosts, logging exec denials on every
      # cluster creation (issue #190).
      sed -i '/chattr +C/d' $SNAPCRAFT_STAGE/usr/bin/pg_createcluster
      # Skip systemd when renaming and dropping
      sed -i \
        "s/'pg_ctlcluster',/'pg_ctlcluster', '--skip-systemctl-redirect',/g" \
        $SNAPCRAFT_STAGE/usr/bin/pg_dropcluster
      sed -i \
        "s/'pg_ctlcluster',/'pg_ctlcluster', '--skip-systemctl-redirect',/g" \
        $SNAPCRAFT_STAGE/usr/bin/pg_renamecluster
    prime:
      # Mute lint by removing unnecessary for PostgreSQL run-time libraries
      # which are shipped as APT Depends packages: libxslt1.1, libicu74.
      - -usr/lib/*/libexslt.so*
      - -usr/lib/*/libicuio.so*
      - -usr/lib/*/libicutest.so*
      - -usr/lib/*/libicutu.so*
    organize:
      etc/postgresql: default-config/etc/postgresql
      etc/postgresql-common: default-config/etc/postgresql-common
      var/lib/postgresql: default-config/var/lib/postgresql
      var/log/postgresql: default-config/var/log/postgresql
      usr/share/doc/postgresql/copyright: licenses/COPYRIGHT-postgresql
      usr/share/doc/util-linux/copyright: licenses/COPYRIGHT-util-linux
      usr/share/doc/locales-all/copyright: licenses/COPYRIGHT-locales-all
  snap-license:
    plugin: dump
    source: .
    source-type: local
    stage:
      - licenses/LICENSE-snap
    organize:
      LICENSE: licenses/LICENSE-snap
  wrapper:
    plugin: dump
    source: snap/local
