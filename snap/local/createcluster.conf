# Defaults for pg_createcluster inside the snap.
#
# Debian's copy lives in /usr/share/postgresql-common/createcluster.conf and
# is installed to /etc/postgresql-common by the deb's postinst, which never
# runs in a snap. Only include_dir is needed here: snap components drop their
# PostgreSQL settings into <cluster>/conf.d/ (see components-env.sh).
add_include_dir = 'conf.d'
